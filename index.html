  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Last Survivor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#10151b}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;pointer-events:none;font-weight:700;text-shadow:0 2px 3px #000}
.box{background:#0009;border:1px solid #ffffff2b;border-radius:10px;padding:8px 11px;font-size:14px}
#healthOuter{width:130px;height:12px;border-radius:7px;background:#333;overflow:hidden;margin-top:4px}
#health{height:100%;width:100%;background:#55d66b}
#start,#gameover{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000b;text-align:center;padding:24px}
.panel{max-width:440px;background:#121923;border:1px solid #ffffff22;border-radius:18px;padding:28px;box-shadow:0 15px 50px #000}
h1{margin:0 0 8px;font-size:38px}p{color:#c7ced8;line-height:1.5}
button{border:0;border-radius:12px;padding:13px 20px;background:#fff;color:#111;font-size:17px;font-weight:800;cursor:pointer}
#controls{position:fixed;left:18px;bottom:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}
#stick,#fire{pointer-events:auto;width:125px;height:125px;border-radius:50%;border:1px solid #fff3;background:#ffffff14;position:relative}
#knob{position:absolute;width:54px;height:54px;border-radius:50%;background:#ffffff55;left:35px;top:35px}
#fire{width:92px;height:92px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;user-select:none}
.hint{font-size:12px;color:#98a2b0}
@media(min-width:800px){#controls{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="box">❤️ <span id="hpText">100</span><div id="healthOuter"><div id="health"></div></div></div>
  <div class="box">🔫 Ammo: <span id="ammo">30</span></div>
  <div class="box">☠️ Score: <span id="score">0</span> &nbsp; Wave: <span id="wave">1</span></div>
</div>
<div id="start"><div class="panel">
<h1>LAST SURVIVOR</h1>
<p>WASD / Arrow Keys / Joystick se move karein. Mouse click ya FIRE button daba kar rakhein shoot karne ke liye. Khaali hone par R dabayein ya wait karein reload ke liye.</p>
<button id="startBtn">START GAME</button>
</div></div>
<div id="gameover" style="display:none"><div class="panel">
<h1>GAME OVER</h1>
<p>You survived to wave <b id="finalWave">1</b> and scored <b id="finalScore">0</b>.</p>
<button id="restartBtn">PLAY AGAIN</button>
</div></div>
<div id="controls"><div id="stick"><div id="knob"></div></div><div id="fire">FIRE</div></div>

<script>
(() => {
const c=document.getElementById('game'),ctx=c.getContext('2d');
const hpEl=document.getElementById('hpText'),healthEl=document.getElementById('health');
const ammoEl=document.getElementById('ammo'),scoreEl=document.getElementById('score'),waveEl=document.getElementById('wave');
const start=document.getElementById('start'),over=document.getElementById('gameover');

let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)} 
addEventListener('resize',resize);resize();

const keys={},mouse={x:W/2,y:H/2,down:false};

addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key===" ") e.preventDefault();
  if(e.key.toLowerCase()==='r' && player && player.ammo < 30 && player.reload <= 0){
    player.reload = 1.5; // Manual Reload with 'R'
  }
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

c.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
c.addEventListener('pointerdown',e=>{if(e.button===0)mouse.down=true});
addEventListener('pointerup',e=>{if(e.button===0)mouse.down=false});

let running=false,player,enemies=[],bullets=[],particles=[],score=0,wave=1,spawnLeft=0,spawnTimer=0,last=performance.now(),fireCD=0;
const joy={x:0,y:0,active:false,id:null},fire={down:false};

function reset(){
 player={x:W/2,y:H/2,r:16,hp:100,speed:220,angle:0,ammo:30,reload:0};
 enemies=[];bullets=[];particles=[];score=0;wave=1;spawnLeft=8;spawnTimer=0;fireCD=0;running=true;
 start.style.display='none';over.style.display='none';
 last=performance.now();
}

function startGame(){reset();requestAnimationFrame(loop)}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;

function spawn(){
 const side=Math.floor(Math.random()*4), pad=35;
 let x,y;
 if(side===0){x=-pad;y=Math.random()*H}else if(side===1){x=W+pad;y=Math.random()*H}
 else if(side===2){x=Math.random()*W;y=-pad}else{x=Math.random()*W;y=H+pad}
 const hp=35+wave*7;
 enemies.push({x,y,r:15+Math.min(wave,8),hp,max:hp,speed:42+wave*3});
}

function getNearestEnemy(){
 let best=null, bd=Infinity;
 for(const e of enemies){
   const d=(e.x-player.x)**2+(e.y-player.y)**2;
   if(d<bd){bd=d;best=e;}
 }
 return best;
}

function shootAt(targetX, targetY){
 if(player.reload > 0) return;
 if(player.ammo <= 0){
   player.reload = 1.5; // Auto reload when empty
   return;
 }
 const dx=targetX-player.x, dy=targetY-player.y, len=Math.hypot(dx,dy)||1;
 bullets.push({
   x: player.x + (dx/len)*18, 
   y: player.y + (dy/len)*18, 
   vx: (dx/len)*650, 
   vy: (dy/len)*650, 
   r: 4, 
   life: 1.2
 });
 player.ammo--; 
 fireCD = 0.15; // Controlled fire rate
}

function burst(x,y,n=7){
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=30+Math.random()*110;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.3})}
}

function update(dt){
 // Fix 1: Smooth Subject Movement
 let mx=0, my=0;
 if(keys['w']||keys['arrowup']) my -= 1;
 if(keys['s']||keys['arrowdown']) my += 1;
 if(keys['a']||keys['arrowleft']) mx -= 1;
 if(keys['d']||keys['arrowright']) mx += 1;

 if(joy.active){mx=joy.x;my=joy.y}

 const len = Math.hypot(mx, my);
 if(len > 0){
   player.x = Math.max(18, Math.min(W-18, player.x + (mx/len)*player.speed*dt));
   player.y = Math.max(18, Math.min(H-18, player.y + (my/len)*player.speed*dt));
 }

 // Target Selection
 const target = getNearestEnemy();
 if(target){
   player.angle = Math.atan2(target.y - player.y, target.x - player.x);
 }

 // Fix 2: Reload timer fix
 if(player.reload > 0){
   player.reload -= dt;
   if(player.reload <= 0){
     player.reload = 0;
     player.ammo = 30; // Ammo reset successfully
   }
 }

 fireCD -= dt;

 // Fix 3: Controlled Shooting (Press / Hold trigger required)
 const wantsToShoot = mouse.down || fire.down || keys[' '];
 if(wantsToShoot && fireCD <= 0 && player.reload <= 0){
   if(target){
     shootAt(target.x, target.y);
   } else {
     shootAt(player.x + Math.cos(player.angle)*100, player.y + Math.sin(player.angle)*100);
   }
 }

 // Wave & Enemies Update
 spawnTimer-=dt;
 if(spawnLeft>0&&spawnTimer<=0){spawn();spawnLeft--;spawnTimer=Math.max(.22,.75-wave*.025)}
 if(spawnLeft===0&&enemies.length===0){wave++;waveEl.textContent=wave;spawnLeft=7+wave*3}

 for(let i=bullets.length-1;i>=0;i--){
   const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
   let hit=false;
   for(let j=enemies.length-1;j>=0;j--){
     const e=enemies[j], d=Math.hypot(b.x-e.x, b.y-e.y);
     if(d < e.r + b.r){
       e.hp -= 25; 
       burst(b.x,b.y,4); 
       hit = true;
       if(e.hp<=0){
         score+=10;
         burst(e.x,e.y,12);
         enemies.splice(j,1);
       }
       break;
     }
   }
   if(hit||b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20) bullets.splice(i,1);
 }

 for(const e of enemies){
   const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
   e.x += (dx/d)*e.speed*dt;
   e.y += (dy/d)*e.speed*dt;
   if(d < e.r + player.r){ player.hp -= 18*dt; }
 }

 for(let i=particles.length-1;i>=0;i--){
   const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.life-=dt;
   if(p.life<=0) particles.splice(i,1);
 }

 if(player.hp<=0){
   running=false;
   document.getElementById('finalScore').textContent=score;
   document.getElementById('finalWave').textContent=wave;
   over.style.display='flex';
 }
 
 hpEl.textContent=Math.max(0,Math.ceil(player.hp));
 healthEl.style.width=Math.max(0,player.hp)+'%';
 ammoEl.textContent = player.reload > 0 ? `RELOADING (${Math.ceil(player.reload)}s)` : player.ammo;
 scoreEl.textContent=score;
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#111820';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#1d2833';ctx.lineWidth=1;
 for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

 ctx.fillStyle='#18222b';
 for(let i=0;i<8;i++){const x=(i*137)%Math.max(1,W-90),y=80+(i*83)%Math.max(1,H-160);ctx.fillRect(x,y,70,22)}
 for(const b of bullets){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}
 for(const e of enemies){
   ctx.fillStyle='#b23b46';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#222';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);
   ctx.fillStyle='#70d879';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*(e.hp/e.max),4);
 }
 if(player){
   ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);
   ctx.fillStyle='#dfe7ef';ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#8c98a5';ctx.fillRect(8,-4,20,8);
   ctx.restore();
 }
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}

function loop(t){
 if(!running)return;
 const dt=Math.min(.033,(t-last)/1000||0);
 last=t;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

// Touch controls handling
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
stick.addEventListener('pointerdown',e=>{joy.active=true;joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);moveJoy(e)});
stick.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id)moveJoy(e)});
stick.addEventListener('pointerup',endJoy);stick.addEventListener('pointercancel',endJoy);

function moveJoy(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,m=48,l=Math.hypot(dx,dy)||1;if(l>m){dx=dx/l*m;dy=dy/l*m}joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}
function endJoy(){joy.active=false;joy.x=0;joy.y=0;knob.style.transform='translate(0,0)'}

const fireBtn=document.getElementById('fire');
fireBtn.addEventListener('pointerdown',e=>{fire.down=true;fireBtn.setPointerCapture(e.pointerId)});
fireBtn.addEventListener('pointerup',()=>fire.down=false);
fireBtn.addEventListener('pointercancel',()=>fire.down=false);
})();
</script>
</body>
</html>

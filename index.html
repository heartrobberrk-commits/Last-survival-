  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Last Survivor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#10151b}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;pointer-events:none;font-weight:700;text-shadow:0 2px 3px #000}
.box{background:#0009;border:1px solid #ffffff2b;border-radius:10px;padding:8px 11px;font-size:14px}
#healthOuter{width:130px;height:12px;border-radius:7px;background:#333;overflow:hidden;margin-top:4px}
#health{height:100%;width:100%;background:#55d66b}
#start,#gameover{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000b;text-align:center;padding:24px}
.panel{max-width:440px;background:#121923;border:1px solid #ffffff22;border-radius:18px;padding:28px;box-shadow:0 15px 50px #000}
h1{margin:0 0 8px;font-size:38px}p{color:#c7ced8;line-height:1.5}
button{border:0;border-radius:12px;padding:13px 20px;background:#fff;color:#111;font-size:17px;font-weight:800;cursor:pointer}
#controls{position:fixed;left:18px;bottom:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}
#stick,#fire{pointer-events:auto;width:125px;height:125px;border-radius:50%;border:1px solid #fff3;background:#ffffff14;position:relative}
#knob{position:absolute;width:54px;height:54px;border-radius:50%;background:#ffffff55;left:35px;top:35px}
#fire{width:92px;height:92px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;user-select:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="box">❤️ <span id="hpText">100</span><div id="healthOuter"><div id="health"></div></div></div>
  <div class="box">🔫 Ammo: <span id="ammo">30</span></div>
  <div class="box">☠️ Score: <span id="score">0</span> &nbsp; Wave: <span id="wave">1</span></div>
</div>
<div id="start"><div class="panel">
<h1>LAST SURVIVOR</h1>
<p>Move with WASD/Joystick and Hold FIRE to shoot enemies!</p>
<button id="startBtn">START GAME</button>
</div></div>
<div id="gameover" style="display:none"><div class="panel">
<h1>GAME OVER</h1>
<p>You survived to wave <b id="finalWave">1</b> and scored <b id="finalScore">0</b>.</p>
<button id="restartBtn">PLAY AGAIN</button>
</div></div>
<div id="controls"><div id="stick"><div id="knob"></div></div><div id="fire">FIRE</div></div>

<script>
(() => {
const c=document.getElementById('game'),ctx=c.getContext('2d');
const hpEl=document.getElementById('hpText'),healthEl=document.getElementById('health');
const ammoEl=document.getElementById('ammo'),scoreEl=document.getElementById('score'),waveEl=document.getElementById('wave');
const start=document.getElementById('start'),over=document.getElementById('gameover');

let W=innerWidth,H=innerHeight;
function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H;} 
addEventListener('resize',resize);resize();

const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let running=false,player,enemies=[],bullets=[],particles=[],score=0,wave=1,spawnLeft=0,spawnTimer=0,last=performance.now(),fireCD=0;
const joy={x:0,y:0,active:false,id:null},fire={down:false};

function reset(){
 player={x:W/2,y:H/2,r:16,hp:100,speed:200,angle:0,ammo:30,reload:0};
 enemies=[];bullets=[];particles=[];score=0;wave=1;spawnLeft=8;spawnTimer=0;fireCD=0;running=true;
 start.style.display='none';over.style.display='none';
 last=performance.now();
}

document.getElementById('startBtn').onclick=()=>{reset();requestAnimationFrame(loop)};
document.getElementById('restartBtn').onclick=()=>{reset();requestAnimationFrame(loop)};

function spawn(){
 const side=Math.floor(Math.random()*4), pad=30;
 let x,y;
 if(side===0){x=-pad;y=Math.random()*H}else if(side===1){x=W+pad;y=Math.random()*H}
 else if(side===2){x=Math.random()*W;y=-pad}else{x=Math.random()*W;y=H+pad}
 const hp=30+wave*5;
 enemies.push({x,y,r:16,hp,max:hp,speed:50+wave*2});
}

function nearestEnemy(){
 let best=null, bd=Infinity;
 for(const e of enemies){
   const d=(e.x-player.x)**2+(e.y-player.y)**2;
   if(d<bd){bd=d;best=e;}
 }
 return best;
}

function update(dt){
 // 1. PLAYER MOVEMENT
 let mx=0, my=0;
 if(keys['w']||keys['arrowup']) my-=1;
 if(keys['s']||keys['arrowdown']) my+=1;
 if(keys['a']||keys['arrowleft']) mx-=1;
 if(keys['d']||keys['arrowright']) mx+=1;
 if(joy.active){mx=joy.x; my=joy.y;}

 const dist=Math.hypot(mx,my);
 if(dist>0){
   player.x+= (mx/dist)*player.speed*dt;
   player.y+= (my/dist)*player.speed*dt;
 }
 player.x=Math.max(player.r, Math.min(W-player.r, player.x));
 player.y=Math.max(player.r, Math.min(H-player.r, player.y));

 // 2. AIM AT ENEMY
 const target=nearestEnemy();
 if(target){
   player.angle=Math.atan2(target.y-player.y, target.x-player.x);
 }

 // 3. RELOAD & FIRE LOGIC
 if(player.reload>0){
   player.reload-=dt;
   if(player.reload<=0){ player.ammo=30; player.reload=0; }
 }

 fireCD-=dt;
 if((fire.down || keys[' ']) && fireCD<=0 && player.reload<=0){
   if(player.ammo>0){
     const angle = target ? Math.atan2(target.y-player.y, target.x-player.x) : player.angle;
     bullets.push({
       x: player.x, y: player.y,
       vx: Math.cos(angle)*600, vy: Math.sin(angle)*600,
       r: 4, life: 1
     });
     player.ammo--;
     fireCD=0.15;
   } else {
     player.reload=1.2; // Auto reload duration
   }
 }

 // 4. SPAWN & BULLETS
 spawnTimer-=dt;
 if(spawnLeft>0 && spawnTimer<=0){ spawn(); spawnLeft--; spawnTimer=0.6; }
 if(spawnLeft===0 && enemies.length===0){ wave++; waveEl.textContent=wave; spawnLeft=6+wave*2; }

 for(let i=bullets.length-1; i>=0; i--){
   const b=bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
   for(let j=enemies.length-1; j>=0; j--){
     const e=enemies[j];
     if(Math.hypot(b.x-e.x, b.y-e.y) < e.r+b.r){
       e.hp-=25; b.life=0;
       if(e.hp<=0){ score+=10; enemies.splice(j,1); }
       break;
     }
   }
   if(b.life<=0) bullets.splice(i,1);
 }

 for(const e of enemies){
   const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
   e.x+= (dx/d)*e.speed*dt;
   e.y+= (dy/d)*e.speed*dt;
   if(d < e.r+player.r){ player.hp -= 15*dt; }
 }

 if(player.hp<=0){
   running=false;
   document.getElementById('finalScore').textContent=score;
   document.getElementById('finalWave').textContent=wave;
   over.style.display='flex';
 }

 hpEl.textContent=Math.max(0,Math.ceil(player.hp));
 healthEl.style.width=Math.max(0,player.hp)+'%';
 ammoEl.textContent= player.reload>0 ? 'RELOADING...' : player.ammo;
 scoreEl.textContent=score;
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#111820'; ctx.fillRect(0,0,W,H);
 
 for(const b of bullets){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28); ctx.fill(); }
 for(const e of enemies){
   ctx.fillStyle='#e63946'; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,6.28); ctx.fill();
   ctx.fillStyle='#55d66b'; ctx.fillRect(e.x-15, e.y-22, 30*(e.hp/e.max), 4);
 }
 if(player){
   ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(player.angle);
   ctx.fillStyle='#4cc9f0'; ctx.beginPath(); ctx.arc(0,0,player.r,0,6.28); ctx.fill();
   ctx.fillStyle='#fff'; ctx.fillRect(8,-3,15,6);
   ctx.restore();
 }
}

function loop(t){
 if(!running)return;
 const dt=Math.min(0.033, (t-last)/1000||0);
 last=t; update(dt); draw();
 requestAnimationFrame(loop);
}

// TOUCH CONTROLS
const stick=document.getElementById('stick'), knob=document.getElementById('knob');
stick.addEventListener('pointerdown',e=>{ joy.active=true; joy.id=e.pointerId; moveJoy(e); });
stick.addEventListener('pointermove',e=>{ if(joy.active && e.pointerId===joy.id) moveJoy(e); });
stick.addEventListener('pointerup',()=>endJoy()); stick.addEventListener('pointercancel',()=>endJoy());

function moveJoy(e){
 const r=stick.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
 let dx=e.clientX-cx, dy=e.clientY-cy, m=40, l=Math.hypot(dx,dy)||1;
 if(l>m){ dx=(dx/l)*m; dy=(dy/l)*m; }
 joy.x=dx/m; joy.y=dy/m;
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}
function endJoy(){ joy.active=false; joy.x=0; joy.y=0; knob.style.transform='translate(0,0)'; }

const fireBtn=document.getElementById('fire');
fireBtn.addEventListener('pointerdown',()=>fire.down=true);
fireBtn.addEventListener('pointerup',()=>fire.down=false);
fireBtn.addEventListener('pointercancel',()=>fire.down=false);
})();
</script>
</body>
</html>
